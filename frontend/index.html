<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 022: every SITE_ token below is filled by the site-meta plugin in
         vite.config.js from site.config.json and global.css, so this file
         never disagrees with the OG image or the page-title helper. The
         tags are static and site-wide: scrapers run no JavaScript, and the
         site-wide description is deliberately program-fact-free (the
         015/021 restraint — link, don't restate; no Registry words). 024:
         while coming_soon the words are the name and "Coming Soon" and
         nothing else. 033: every icon, logo.png, and og.png are derived
         from brand/ by scripts/sync_brand.py (raster sources only, so the
         favicons are PNG and ICO — there is no SVG favicon); the ?v=3
         busts the 024 icons. -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta name="theme-color" content="%SITE_THEME_COLOR%" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png?v=3" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png?v=3" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "%SITE_NAME%",
        "url": "%SITE_ORIGIN%/",
        "logo": "%SITE_ORIGIN%/logo.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
